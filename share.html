<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save to FlatFinder</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
  main.share { max-width: 480px; }
  #shareForm { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  #shareForm label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  #shareForm input, #shareForm select, #shareForm textarea { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit; color: var(--text); }
  #shareStatus { font-size: 0.85rem; }
  #shareStatus.ok { color: var(--accent); }
  #shareStatus.err { color: var(--danger); }
  #matchStatus { font-size: 0.9rem; font-weight: 600; }
  #matchStatus.confirmed { color: var(--accent); }
  #matchStatus.needs_verification { color: var(--warn); }
  #matchStatus.rejected { color: var(--danger); }
  .needs-review { border-color: #d99a1c !important; }
</style>
</head>
<body>
<header>
  <h1>Save to FlatFinder</h1>
  <p class="subtitle">Shared from another app — review before saving. Same hard filter as the automated pipeline applies here.</p>
</header>
<main class="share">
  <form id="shareForm">
    <label>Paste the post's text here to auto-fill the fields below
      <textarea id="pasteBox" rows="4" placeholder="Facebook/WhatsApp shares usually only carry a link, not the post's caption — copy the actual post text yourself and paste it here to auto-fill BHK/rent/deposit/etc."></textarea>
    </label>
    <label>Title <input type="text" id="title"></label>
    <label>Location / address <input type="text" id="location" required></label>
    <label>BHK <input type="number" id="bhk" step="0.5" min="0" value="1"></label>
    <label>Furnishing
      <select id="furnishing">
        <option value="">Unknown</option>
        <option value="full">Fully furnished</option>
        <option value="semi">Semi furnished</option>
        <option value="none">Unfurnished</option>
      </select>
    </label>
    <label>Lift
      <select id="lift">
        <option value="">Unknown</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </label>
    <label>Rent (₹/month) <input type="number" id="rent" min="0"></label>
    <label>Deposit (₹) <input type="number" id="deposit" min="0"></label>
    <label>Brokerage
      <select id="brokerageStatus">
        <option value="">Unknown</option>
        <option value="zero">₹0 / owner-direct</option>
        <option value="broker">Broker involved</option>
      </select>
    </label>
    <label>Owner/broker
      <select id="ownerStatus">
        <option value="">Unknown</option>
        <option value="owner">Owner-direct</option>
        <option value="broker">Broker</option>
      </select>
    </label>
    <label>Contact <input type="text" id="contact"></label>
    <label>Source <input type="text" id="source"></label>
    <label>Link <input type="url" id="link"></label>
    <label>Raw text (kept for audit) <textarea id="notes" rows="4"></textarea></label>
    <button type="submit" id="saveShare" style="padding:10px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;">Save listing</button>
    <div id="matchStatus"></div>
    <div id="shareStatus"></div>
  </form>
</main>

<script src="config.js"></script>
<script src="parser.js"></script>
<script src="geo-client.js"></script>
<script src="filter-client.js"></script>
<script src="supabase-client.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const sourceUrl = params.get("url") || "";
  // Deliberately excludes the url from the text handed to the parser — a
  // bare link with no real title/caption (the common case: Android's
  // share sheet for a Facebook post usually only carries the link, not
  // its text) would otherwise get picked up as the "first line" and show
  // up as the Title, which is misleading rather than useful.
  const sharedText = [params.get("title"), params.get("text")].filter(Boolean).join("\n");

  function fillFieldsFromParsed(parsed) {
    const fieldIds = ["title", "location", "bhk", "furnishing", "lift", "rent", "deposit", "brokerageStatus", "ownerStatus", "contact", "source", "link"];
    fieldIds.forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      const value = parsed[id];
      if (value !== null && value !== undefined) el.value = value;
    });
    document.getElementById("notes").value = parsed.rawText || "";

    document.querySelectorAll(".needs-review").forEach((el) => el.classList.remove("needs-review"));
    Object.entries(parsed.confidence || {}).forEach(([id, confident]) => {
      const el = document.getElementById(id);
      if (el && !confident) el.classList.add("needs-review");
    });
  }

  fillFieldsFromParsed(FlatFinderParser.parse(sharedText, { sourceUrl }));
  document.getElementById("link").value = sourceUrl;

  // Facebook/WhatsApp shares carry only a link, not the post's caption —
  // pasting the real text here re-parses against it instead, same as the
  // "+ Add a listing" paste box on the main site.
  document.getElementById("pasteBox").addEventListener("input", (e) => {
    const raw = e.target.value.trim();
    if (!raw) return;
    fillFieldsFromParsed(FlatFinderParser.parse(raw, { sourceUrl }));
    document.getElementById("link").value = sourceUrl;
  });

  const statusEl = document.getElementById("shareStatus");
  const matchEl = document.getElementById("matchStatus");

  document.getElementById("shareForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.FlatFinderSupabase.isConfigured()) {
      statusEl.textContent = "No shared backend configured — set SUPABASE_URL/SUPABASE_ANON_KEY in config.js first (see README).";
      statusEl.className = "err";
      return;
    }

    statusEl.textContent = "Geocoding and computing commute…";
    statusEl.className = "";

    const formParsed = {
      title: document.getElementById("title").value.trim() || null,
      location: document.getElementById("location").value.trim() || null,
      address: document.getElementById("location").value.trim() || null,
      bhk: parseFloat(document.getElementById("bhk").value) || null,
      furnishing: document.getElementById("furnishing").value || null,
      lift: document.getElementById("lift").value === "true" ? true : document.getElementById("lift").value === "false" ? false : null,
      rent: parseFloat(document.getElementById("rent").value) || null,
      deposit: parseFloat(document.getElementById("deposit").value) || null,
      brokerageStatus: document.getElementById("brokerageStatus").value || null,
      brokerageAmount: document.getElementById("brokerageStatus").value === "zero" ? 0 : null,
      ownerStatus: document.getElementById("ownerStatus").value || null,
      source: document.getElementById("source").value.trim() || "Mobile share",
      url: document.getElementById("link").value.trim() || null,
      rawText: document.getElementById("notes").value.trim() || null,
    };

    let lat = null, lng = null, commuteMinutes = null, commuteSource = null;
    const officeAddress = (typeof CONFIG !== "undefined" && CONFIG.OFFICE_ADDRESS) || "";
    if (formParsed.location && officeAddress) {
      const officeCoords = await window.FlatFinderGeo.geocodeOffice(officeAddress);
      const originCoords = await window.FlatFinderGeo.geocode(formParsed.location);
      if (originCoords) {
        lat = originCoords.lat;
        lng = originCoords.lng;
        if (officeCoords) {
          const result = await window.FlatFinderGeo.commuteMinutes(originCoords, officeCoords);
          commuteMinutes = result.minutes;
          commuteSource = result.source;
        }
      }
    }

    const stored = window.FlatFinderFilter.buildStoredListing(formParsed, {
      sourceListingId: `manual-${Date.now()}`,
      lat, lng, commuteMinutes, commuteSource,
    });
    const requirements = (typeof CONFIG !== "undefined" && CONFIG.REQUIREMENTS) || {
      bhk: 1, furnishing: "semi", maxRent: 15000, maxDeposit: 50000, lift: true, brokerageZero: true, maxCommuteMinutes: 30,
    };
    window.FlatFinderFilter.applyHardFilter(stored, requirements);
    matchEl.textContent = `Match status: ${stored.match_status.replace("_", " ")}`;
    matchEl.className = stored.match_status;

    try {
      await window.FlatFinderSupabase.insertListing(stored);
      statusEl.textContent = "Saved. You can close this tab.";
      statusEl.className = "ok";
    } catch (err) {
      statusEl.textContent = "Couldn't reach the database — check your connection.";
      statusEl.className = "err";
    }
  });
</script>
</body>
</html>
