name: Scrape NoBroker listings

on:
  schedule:
    # Every 2 hours. Keep this infrequent — it costs Apify usage credits per
    # run and there's no need to poll more often than that for a personal search.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch + print only, don't post to the sheet)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python scripts/scrape_nobroker.py
