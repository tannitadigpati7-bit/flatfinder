<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlatFinder — Manyata Tech Park</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FlatFinder</h1>
  <p class="subtitle">1BHK furnished flats near Manyata Tech Park — no brokerage</p>
</header>

<main>
  <section class="filters" aria-label="Search filters">
    <div class="field">
      <label for="search">Search</label>
      <input type="text" id="search" placeholder="Locality, title, notes...">
    </div>

    <div class="field">
      <label for="bhk">BHK</label>
      <select id="bhk">
        <option value="">Any</option>
        <option value="1">1 BHK</option>
        <option value="2">2 BHK</option>
        <option value="3">3+ BHK</option>
      </select>
    </div>

    <div class="field">
      <label for="furnishing">Furnishing</label>
      <select id="furnishing">
        <option value="">Any</option>
        <option value="full">Fully furnished</option>
        <option value="semi">Semi furnished</option>
        <option value="none">Unfurnished</option>
      </select>
    </div>

    <div class="field">
      <label for="maxRent">Max rent (₹)</label>
      <input type="number" id="maxRent" placeholder="e.g. 25000" min="0" step="500">
    </div>

    <div class="field">
      <label for="maxDistance">Max distance from Manyata (km)</label>
      <input type="number" id="maxDistance" placeholder="e.g. 5" min="0" step="0.5">
    </div>

    <div class="field checkbox-field">
      <label>
        <input type="checkbox" id="noBrokerage" checked>
        No brokerage only
      </label>
    </div>

    <div class="field">
      <label for="sortBy">Sort by</label>
      <select id="sortBy">
        <option value="distance">Distance (nearest first)</option>
        <option value="rent">Rent (lowest first)</option>
        <option value="newest">Recently added</option>
      </select>
    </div>

    <button id="resetFilters" type="button">Reset filters</button>
  </section>

  <section class="results-header">
    <h2 id="resultCount">Loading listings…</h2>
    <button id="addListingBtn" type="button">+ Add a listing</button>
  </section>

  <section id="results" class="results" aria-live="polite"></section>
</main>

<dialog id="addListingDialog">
  <form id="addListingForm" method="dialog">
    <h2>Add a listing</h2>
    <p class="hint">Paste in details from a group post or listing site as soon as you see them — this saves it to your browser so it shows up in your search from now on.</p>

    <label>Title
      <input type="text" name="title" required placeholder="e.g. 1BHK furnished, Hebbal">
    </label>
    <label>Locality
      <input type="text" name="locality" required placeholder="e.g. Hebbal">
    </label>
    <label>Approx. distance from Manyata (km)
      <input type="number" name="distanceKm" step="0.1" min="0">
    </label>
    <label>BHK
      <select name="bhk">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3+</option>
      </select>
    </label>
    <label>Furnishing
      <select name="furnishing">
        <option value="full">Fully furnished</option>
        <option value="semi">Semi furnished</option>
        <option value="none">Unfurnished</option>
      </select>
    </label>
    <label>Rent (₹/month)
      <input type="number" name="rent" min="0" step="500">
    </label>
    <label>Deposit (₹)
      <input type="number" name="deposit" min="0" step="1000">
    </label>
    <label class="checkbox-field">
      <input type="checkbox" name="brokerage">
      Brokerage involved
    </label>
    <label>Contact
      <input type="text" name="contact" placeholder="Name / phone / who posted it">
    </label>
    <label>Source
      <input type="text" name="source" placeholder="e.g. WhatsApp group, NoBroker, 99acres">
    </label>
    <label>Link (optional)
      <input type="url" name="link" placeholder="https://...">
    </label>
    <label>Notes
      <textarea name="notes" rows="2" placeholder="Anything else worth remembering"></textarea>
    </label>

    <div class="dialog-actions">
      <button type="button" id="cancelAdd">Cancel</button>
      <button type="submit" id="saveAdd">Save listing</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
